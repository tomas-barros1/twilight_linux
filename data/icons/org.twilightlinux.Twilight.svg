<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Twilight">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1440"/>
      <stop offset="55%" stop-color="#4a2c6a"/>
      <stop offset="100%" stop-color="#c45c26"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9c2"/>
      <stop offset="100%" stop-color="#f0c27b"/>
    </linearGradient>
    <!-- Recorte real da crescente: o gradiente do céu aparece através do corte. -->
    <mask id="crescent-cut">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="96" cy="36" r="22" fill="#000"/>
    </mask>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#sky)"/>
  <circle cx="86" cy="44" r="26" fill="url(#moon)" mask="url(#crescent-cut)"/>
  <!-- Estrelinhas discretas no crepúsculo -->
  <circle cx="30" cy="30" r="2.2" fill="#ffe9c2" opacity="0.9"/>
  <circle cx="52" cy="20" r="1.6" fill="#ffe9c2" opacity="0.7"/>
  <circle cx="18" cy="56" r="1.4" fill="#ffe9c2" opacity="0.6"/>
  <path d="M0 92 C28 78 52 98 76 88 C100 78 112 86 128 80 L128 128 L0 128 Z" fill="#2a1838" opacity="0.85"/>
</svg>
